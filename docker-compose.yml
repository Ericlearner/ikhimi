# Local development stack. Mirrors a self-hosted server (§6): Postgres 16 + pgvector, S3-compatible storage.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ikhimi
      POSTGRES_PASSWORD: ikhimi
      POSTGRES_DB: ikhimi
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ikhimi']
      interval: 2s
      retries: 20

  # S3-compatible object storage. MinIO's open-source server is archived (no security updates),
  # so we run SeaweedFS (Apache-2.0). The app speaks plain S3; any compatible store works. See DECISIONS.md.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ['9000:9000']
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  s3data:
